<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="시간표">
<meta name="theme-color" content="#0d1f1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>주간 시간표</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  /* AstroPay palette */
  --dark:#0d1f1a;
  --dark2:#122b24;
  --dark3:#1a3830;
  --mint:#00c897;
  --mint-dim:#00a87e;
  --mint-soft:rgba(0,200,151,.12);
  --surface:#ffffff;
  --surface2:#f4f6f5;
  --surface3:#eaf1ef;
  --border:#c3cbce;
  --border-dark:rgba(255,255,255,.1);
  --text1:#0d1f1a;
  --text2:#4a6660;
  --text3:#8aada6;
  --radius:10px;
  --radius-lg:16px;
  /* cell colors — 실제 시간표 엑셀과 동일하게: 정쌤=노랑, 박쌤=파랑 */
  --cell-pub:#fde68a;
  --cell-park:#93c5fd;
  --cell-special:#fdba74;
  --cell-off:#eef2f0;
  --cell-label:#fdeaf6;
}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--surface2);color:var(--text1);min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.5;}

/* ── HEADER: dark green like AstroPay ── */
.site-header{background:var(--dark);position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.25);}
.header-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-icon{width:32px;height:32px;border-radius:8px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.header-titles{display:flex;flex-direction:column;gap:2px;}

/* ghost inputs — dark bg version */
.ghost-inp{font-family:inherit;background:transparent;border:1px solid transparent;border-radius:6px;outline:none;cursor:pointer;transition:all .15s;color:#fff;}
.ghost-inp:hover{border-color:var(--border-dark);background:rgba(255,255,255,.07);}
.ghost-inp:focus{border-color:var(--mint);background:rgba(255,255,255,.1);cursor:text;}
.title-inp{font-size:16px;font-weight:700;padding:3px 8px;letter-spacing:-.01em;}
.subtitle-inp{font-size:11px;color:var(--text3);padding:2px 6px;}
.ghost-inp::placeholder{color:rgba(255,255,255,.3);}

.header-right{display:flex;align-items:center;gap:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--mint);color:var(--dark);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.user-fields{display:flex;flex-direction:column;gap:1px;}
.user-inp{font-size:12px;font-weight:500;padding:2px 6px;width:90px;color:#fff;}
.user-inp.role{font-size:11px;color:var(--text3);font-weight:400;}
.sep{width:1px;height:24px;background:var(--border-dark);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:13px;font-weight:500;padding:8px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text1);cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1;}
.btn:hover{background:var(--surface3);border-color:var(--mint-dim);}
.btn-mint{background:var(--mint);color:var(--dark);border-color:var(--mint);font-weight:600;}
.btn-mint:hover{background:var(--mint-dim);border-color:var(--mint-dim);}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--surface3);}
.btn-sm{font-size:12px;padding:6px 12px;}
/* header 안 버튼은 밝은 버전 */
.btn-header{background:var(--mint);color:var(--dark);border-color:var(--mint);font-weight:600;font-size:12px;padding:7px 16px;border-radius:var(--radius);}
.btn-header:hover{background:var(--mint-dim);color:var(--dark);}

/* ── LAYOUT ── */
.main-wrap{max-width:1400px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px;flex:1;}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;color:var(--text1);display:flex;align-items:center;gap:8px;}
.card-title .week-lbl{font-size:11px;font-weight:400;color:var(--text3);margin-left:4px;}

/* ── 부담임 카드 ── */
.hr-toggle{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background .15s;}
.hr-toggle:hover{background:var(--surface2);}
.hr-toggle-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.hr-toggle-title{font-size:13px;font-weight:600;color:var(--text1);}
.chevron{font-size:11px;color:var(--text3);transition:transform .22s;flex-shrink:0;}
.chevron.open{transform:rotate(180deg);}
.hr-summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:8px;}
.hr-person{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
.hr-dot{width:7px;height:7px;border-radius:50%;}
.hr-sep-v{width:1px;height:12px;background:var(--border);}

/* 범례 바 */
.legend-bar{padding:10px 20px;border-top:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.legend-lbl{font-size:11px;color:var(--text3);margin-right:4px;}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-inp{font-size:11px;padding:2px 6px;width:76px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text1);font-family:inherit;outline:none;cursor:pointer;transition:all .15s;}
.legend-inp:hover{border-color:var(--border);background:var(--surface);}
.legend-inp:focus{border-color:var(--mint);background:var(--surface);cursor:text;}

/* 부담임 바디 */
.hr-body{border-top:1px solid var(--border);padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.person-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);}
.person-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.person-field{display:flex;flex-direction:column;gap:3px;}
.field-lbl{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.person-inp{font-size:12px;padding:5px 9px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text1);font-family:inherit;outline:none;transition:all .15s;}
.person-inp:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft);}
.pi-name{width:90px;}.pi-class{width:66px;}.pi-note{width:130px;}.pi-cat{width:76px;cursor:pointer;}
.person-del{border:none;background:none;cursor:pointer;color:var(--text3);font-size:17px;padding:0 3px;margin-left:auto;line-height:1;}
.person-del:hover{color:#e05252;}
.hr-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

/* ── TIMETABLE ── */
.tt-scroll{overflow-x:auto;padding:16px 20px;}
.tt-table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;border:1.5px solid var(--border);}
.tt-table col.col-lbl{width:64px;}
.tt-table col.col-time{width:96px;}
.tt-table col.col-day{width:calc((100% - 160px) / 5);}
.tt-table th{background:var(--cell-label);font-weight:700;color:var(--text1);font-size:10px;padding:8px;text-align:center;border:1.5px solid var(--border);letter-spacing:.04em;}
.tt-table td{padding:7px 8px;text-align:center;vertical-align:middle;border:1.5px solid var(--border);}
.row-lbl{background:var(--cell-label);font-weight:700;color:var(--text1);font-size:10px;white-space:nowrap;}
.row-time{font-size:9px;color:var(--text2);background:var(--cell-label);}

/* ── 셀 클릭 선택 강조 ── */
.row-lbl-selected{background:var(--dark) !important;color:#fff !important;}
.row-time-selected{background:var(--dark) !important;color:#fff !important;}
.th-col-selected{background:var(--dark) !important;color:#fff !important;}
.cell-selected{outline:2.5px solid var(--dark) !important;outline-offset:-2px;position:relative;z-index:2;cursor:pointer;}
.tt-table td.has-content{cursor:pointer;}
.tt-table td.has-content:hover{filter:brightness(.94);}
.th-today{background:#dc2626 !important;color:#fff !important;border-left:3px solid #dc2626 !important;border-right:3px solid #dc2626 !important;border-top:3px solid #dc2626 !important;}
/* 오늘 요일 — 셀 하나하나가 아니라 해당 열 전체를 좌우 굵은 테두리로 감쌈 */
.day-col-today{border-left:3px solid #dc2626 !important;border-right:3px solid #dc2626 !important;}
.day-col-today-last{border-bottom:3px solid #dc2626 !important;}
.cell-pub{background:var(--cell-pub);}
.cell-park{background:var(--cell-park);}
.cell-special{background:var(--cell-special);}
.cell-off{background:var(--cell-off);}
.cell-empty{}
/* 1~7교시(수업 시간) vs 등교/조회/점심/청소·종례~야자(쉬는·비수업 시간) 한눈에 구분 */
.tt-row-period .row-lbl,.tt-row-period .row-time{background:#f6c9e6;}
.tt-row-rest .row-lbl,.tt-row-rest .row-time{background:#fbf3f8;}
.tt-row-period td.cell-empty{background:#ffffff;}
.tt-row-rest td.cell-empty{background:#eef0f1;}
.cell-txt{font-size:10px;font-weight:600;color:var(--text1);line-height:1.3;}
.cell-off .cell-txt{font-weight:400;color:var(--text3);}
.cell-txt2{font-size:10px;font-weight:600;color:var(--text1);line-height:1.3;margin-top:3px;padding-top:3px;border-top:1px dashed var(--border);}

/* 편집 모드 */
.cell-edit-wrap{display:flex;flex-direction:column;gap:2px;min-width:72px;padding:2px;}
.cell-inp{font-size:10px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;width:100%;font-family:inherit;background:var(--surface);color:var(--text1);outline:none;text-align:center;}
.cell-inp:focus{border-color:var(--mint);}
.cell-edit-divider{font-size:8px;color:var(--text3);text-align:center;padding:2px 0;border-top:1px dashed var(--border);margin-top:2px;}
.cell-inp2{font-size:10px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;width:100%;font-family:inherit;background:var(--surface2);color:var(--text1);outline:none;text-align:center;}
.cell-inp2:focus{border-color:var(--mint);background:var(--surface);}
.cell-inp2::placeholder{color:var(--text3);}
.cat-sel{font-size:9px;padding:2px;border:1px solid var(--border);border-radius:4px;width:100%;font-family:inherit;background:var(--surface);color:var(--text1);outline:none;margin-top:2px;}
.row-lbl-inp{font-size:10px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;font-family:inherit;background:var(--surface);color:var(--text1);outline:none;text-align:center;width:56px;}
.time-inp{font-size:10px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;font-family:inherit;background:var(--surface);color:var(--text1);outline:none;text-align:center;width:94px;}
.del-row-btn{font-size:9px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text3);cursor:pointer;margin-left:3px;display:none;}
.del-row-btn:hover{color:#e05252;border-color:#e05252;}
.editing-mode .del-row-btn{display:inline-block;}
.add-row-btn{width:100%;font-size:12px;padding:9px;border-radius:var(--radius);border:1.5px dashed var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;font-family:inherit;margin-top:10px;display:none;}
.add-row-btn:hover{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-dim);}
.editing-mode .add-row-btn{display:block;}

/* ── MOBILE OPTIMIZATION ── */
@media(max-width:768px){
  /* 헤더 */
  .header-inner{padding:0 14px;height:52px;gap:8px;}
  .subtitle-inp{display:none;}
  .title-inp{font-size:14px;padding:2px 6px;}
  .user-inp{width:72px;font-size:11px;}
  .user-inp.role{display:none;}
  .sep{display:none;}
  .btn-header{font-size:11px;padding:6px 12px;}

  /* 레이아웃 */
  .main-wrap{padding:10px;gap:10px;}

  /* 부담임 카드 */
  .hr-toggle{padding:11px 14px;}
  .hr-toggle-title{font-size:12px;}
  .hr-person{font-size:11px;}
  .legend-bar{padding:8px 14px;gap:8px;}
  .legend-inp{width:64px;font-size:10px;}
  .hr-body{padding:12px 14px;gap:8px;}
  .person-row{flex-wrap:wrap;padding:8px 10px;gap:6px;}
  .pi-note{width:100%;}
  .pi-name{width:80px;}
  .pi-class{width:58px;}

  /* 시간표 카드 */
  .card-header{padding:11px 14px;}
  .card-title{font-size:12px;}
  .tt-scroll{padding:8px 10px;-webkit-overflow-scrolling:touch;}

  /* 시간표 테이블 — 모바일에서 글자 더 작게 */
  .tt-table{font-size:10px;}
  .tt-table th{padding:6px 4px;font-size:9px;letter-spacing:0;}
  .tt-table td{padding:5px 3px;}
  .tt-table col.col-lbl{width:44px;}
  .tt-table col.col-time{width:72px;}
  .tt-table col.col-day{width:calc((100% - 116px) / 5);}
  .row-lbl{font-size:9px;}
  .row-time{font-size:8px;}
  .cell-txt{font-size:9px;}
  .cell-txt2{font-size:9px;}

  /* 편집 모드 */
  .cell-edit-wrap{min-width:52px;}
  .cell-inp{font-size:9px;padding:2px 3px;}
  .cell-inp2{font-size:9px;padding:2px 3px;}
  .cat-sel{font-size:8px;}
  .row-lbl-inp{width:44px;font-size:9px;}
  .time-inp{width:70px;font-size:9px;}

  /* 버튼 */
  .btn-sm{font-size:11px;padding:5px 9px;}
  .add-row-btn{font-size:11px;padding:8px;}

  /* 토스트 */
  .toast{bottom:14px;right:14px;font-size:11px;padding:9px 14px;}
}

@media(max-width:480px){
  /* 헤더 — 매우 작은 화면 */
  .header-inner{height:48px;padding:0 12px;}
  .user-fields,.avatar{display:none;}
  .title-inp{font-size:13px;}

  /* 레이아웃 */
  .main-wrap{padding:8px;gap:8px;}

  /* 시간표 — 가로 스크롤 허용, 최소 너비 보장 */
  .tt-scroll{padding:6px 8px;}
  .tt-table{min-width:360px;}
  .tt-table col.col-lbl{width:38px;}
  .tt-table col.col-time{width:64px;}
  .tt-table col.col-day{width:calc((100% - 102px) / 5);}
  .tt-table th{padding:5px 3px;font-size:8px;}
  .tt-table td{padding:4px 2px;}
  .cell-txt{font-size:8px;}
  .cell-txt2{font-size:8px;}
  .row-time{font-size:7px;}
  .row-lbl{font-size:8px;}
}

/* iOS 홈 화면 앱 모드 */
@media(display-mode:standalone){
  .site-header{padding-top:env(safe-area-inset-top);}
  .main-wrap{padding-bottom:env(safe-area-inset-bottom);}
}

/* ── TOAST ── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--dark);color:#fff;font-size:12px;font-weight:500;padding:11px 18px;border-radius:var(--radius);opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2);transform:translateY(6px);z-index:999;border-left:3px solid var(--mint);}
.toast.show{opacity:1;transform:translateY(0);}

/* ── 편집 모드 홀짝 행 구분 ── */
.editing-mode .tt-row-even td{background-color:rgba(0,200,151,.06)!important;}
.editing-mode .tt-row-odd td{background-color:rgba(255,255,255,1)!important;}
.editing-mode .tt-row-even .row-lbl,
.editing-mode .tt-row-even .row-time{background-color:rgba(0,200,151,.1)!important;}
.editing-mode .tt-row-odd .row-lbl,
.editing-mode .tt-row-odd .row-time{background-color:var(--surface2)!important;}

/* ── 인쇄 스타일 ── */
@media print{
  @page{size:A4;margin:12mm 10mm;}
  body{background:#fff!important;font-size:11px;}
  .site-header,.card:first-child,.toast{display:none!important;}
  .main-wrap{padding:0!important;gap:8px!important;}
  .card{box-shadow:none!important;border:1px solid #ccc!important;border-radius:4px!important;}
  .card-header{padding:8px 12px!important;}
  .tt-scroll{padding:8px 12px!important;overflow:visible!important;}
  .tt-table{font-size:9px!important;width:100%!important;}
  .tt-table th{font-size:9px!important;padding:5px 4px!important;background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .tt-table td{padding:4px 3px!important;}
  .cell-pub,.cell-park,.cell-special,.cell-off{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .cell-txt,.cell-txt2{font-size:9px!important;}
  .add-row-btn{display:none!important;}
  /* 인쇄 헤더 */
  .print-header{display:block!important;}
}
.print-header{display:none;text-align:center;margin-bottom:8px;font-size:14px;font-weight:700;color:#000;}
.sem-tab-btn.active{background:var(--mint);color:var(--dark);border-color:var(--mint);font-weight:700;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-icon">📚</div>
      <div class="header-titles">
        <input class="ghost-inp title-inp" id="appTitleInp" type="text" value="주간 시간표" placeholder="제목">
        <input class="ghost-inp subtitle-inp" id="appSubtitleInp" type="text" placeholder="부제목...">
      </div>
    </div>
    <div class="header-right">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="avatar" id="avatarEl">선</div>
        <div class="user-fields">
          <input class="ghost-inp user-inp" id="userNameInp" type="text" placeholder="이름">
          <input class="ghost-inp user-inp role" id="userRoleInp" type="text" placeholder="역할">
        </div>
      </div>
      <div class="sep"></div>
      <span id="syncStatus" style="font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap;"></span>
      <button class="btn-header" id="reloadBtn" style="background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);">🔄 다시 불러오기</button>
      <button class="btn-header" id="exportBtn">💾 내보내기</button>
    </div>
  </div>
</header>

<div class="main-wrap">

  <!-- 부담임 카드 -->
  <div class="card">
    <div class="hr-toggle" id="hrToggle">
      <div class="hr-toggle-left">
        <span>📋</span>
        <span class="hr-toggle-title">부담임 담당반</span>
        <div class="hr-summary" id="hrSummary"></div>
      </div>
      <span class="chevron" id="chevron">▼</span>
    </div>
    <div class="legend-bar">
      <span class="legend-lbl">색상 구분:</span>
      <div id="legendItems" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;"></div>
    </div>
    <div class="hr-body" id="hrBody" style="display:none;">
      <div id="homeroomList"></div>
      <div class="hr-actions">
        <button class="btn btn-ghost btn-sm" id="addPersonBtn">+ 담임 추가</button>
        <button class="btn btn-mint btn-sm" id="hrSaveBtn">✅ 저장 &amp; 닫기</button>
      </div>
    </div>
  </div>

  <!-- 시간표 카드 -->
  <div class="card">

const CONFIG = {

let ACTIVE_SEMESTER = '1학기';

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d));}catch(e){return JSON.parse(JSON.stringify(d));}}
function sv(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  queueSync(k);
}

// ── 자동저장(디바운스 1초) ──
const syncTimers={};
function queueSync(key){
  if(!CLOUD_ENABLED) return;
  let timerKey;
  if(key.indexOf('tt_data_v2_')===0){
    const sem=key.substring('tt_data_v2_'.length);
    timerKey='schedule:'+sem;
    clearTimeout(syncTimers[timerKey]);
    syncTimers[timerKey]=setTimeout(()=>cloudSaveSchedule(sem),1000);
  }else if(key==='homeroom_data'||key==='legend_data'||key==='user_info'){
    timerKey='settings';
    clearTimeout(syncTimers[timerKey]);
    syncTimers[timerKey]=setTimeout(()=>cloudSaveSettings(),1000);
  }
}

function setSyncStatus(state){
  const el=document.getElementById('syncStatus');if(!el)return;
  clearTimeout(setSyncStatus._t);
  if(state==='saving'){el.textContent='⏳ 저장 중...';}
  else if(state==='done'){
    el.textContent='✅ 저장됨';
    setSyncStatus._t=setTimeout(()=>{if(el.textContent==='✅ 저장됨')el.textContent='';},2500);
  }else if(state==='error'){el.textContent='⚠️ 저장 실패 (연결 확인)';}
  else if(state==='loading'){el.textContent='🔄 불러오는 중...';}
  else{el.textContent='';}
}

async function cloudSaveSchedule(semester){
  if(!CLOUD_ENABLED) return;
  setSyncStatus('saving');
  try{
    const rows = (semester===ACTIVE_SEMESTER) ? tt.rows : JSON.parse(localStorage.getItem('tt_data_v2_'+semester)||'{"rows":[]}').rows;
    const res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save_schedule',semester:semester,rows:rows})});
    const data=await res.json();
    setSyncStatus(data.ok?'done':'error');
  }catch(err){console.error(err);setSyncStatus('error');}
}

function legendNameOf(key){const it=(legend||[]).find(l=>l.key===key);return it?it.name:'';}

async function cloudSaveSettings(){
  if(!CLOUD_ENABLED) return;
  setSyncStatus('saving');
  try{
    const payload={
      appTitle:ui.appTitle,appSubtitle:ui.appSubtitle,userName:ui.name,userRole:ui.role,
      legend:{pub:legendNameOf('pub'),park:legendNameOf('park'),special:legendNameOf('special'),off:legendNameOf('off')},
      homeroom:hr
    };
    const res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save_settings',settings:payload})});
    const data=await res.json();
    setSyncStatus(data.ok?'done':'error');
  }catch(err){console.error(err);setSyncStatus('error');}
}

let semesterCache={'1학기':null,'2학기':null};
let needsSeedSchedule={'1학기':false,'2학기':false};
let needsSeedSettings=false;
async function cloudLoadAll(){
  if(!CLOUD_ENABLED) return false;
  setSyncStatus('loading');
  try{
    const res=await fetch(CONFIG.API_URL,{method:'GET'});
    const data=await res.json();
    if(!data.ok) return false;
    ['1학기','2학기'].forEach(sem=>{
      if(data[sem]&&Array.isArray(data[sem].rows)&&data[sem].rows.length){
        semesterCache[sem]=data[sem];
        localStorage.setItem('tt_data_v2_'+sem,JSON.stringify(data[sem]));
      }else{
        needsSeedSchedule[sem]=true; // 시트가 비어있음 → 최초 1회 기본 데이터 업로드 예정
      }
    });
    if(data.settings){
      const s=data.settings;
      if(s.appTitle)ui.appTitle=s.appTitle;
      ui.appSubtitle=s.appSubtitle||ui.appSubtitle;
      if(s.userName)ui.name=s.userName;
      if(s.userRole)ui.role=s.userRole;
      localStorage.setItem('user_info',JSON.stringify(ui));
      if(s.legend){
        legend.forEach(l=>{if(s.legend[l.key])l.name=s.legend[l.key];});
        localStorage.setItem('legend_data',JSON.stringify(legend));
      }
      if(Array.isArray(s.homeroom)&&s.homeroom.length){
        hr=s.homeroom;
        localStorage.setItem('homeroom_data',JSON.stringify(hr));
      }else{
        needsSeedSettings=true; // 부담임 정보가 비어있음 → 최초 1회 기본값 업로드 예정
      }
    }
    return true;
  }catch(err){console.error(err);return false;}
}

function renderTT(){
  const tdow=today.getDay(),tci=(tdow>=1&&tdow<=5)?tdow-1:-1;
  const ws=new Date(today);ws.setDate(today.getDate()-(today.getDay()===0?6:today.getDay()-1));
  const we=new Date(ws);we.setDate(ws.getDate()+4);
  $('weekLbl').textContent=`${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}`;
  const thead=$('ttHead'),tbody=$('ttBody');thead.innerHTML='';tbody.innerHTML='';
  // colgroup으로 열 너비 고정
  const tbl=thead.parentNode;
  let colg=tbl.querySelector('colgroup');
  if(!colg){
    colg=document.createElement('colgroup');
    colg.innerHTML='<col class="col-lbl"><col class="col-time"><col class="col-day"><col class="col-day"><col class="col-day"><col class="col-day"><col class="col-day">';
    tbl.prepend(colg);
  }  const hrow=document.createElement('tr');
  ['교시','시간','월','화','수','목','금'].forEach((l,i)=>{
    const th=document.createElement('th');th.textContent=l;
    if(i>=2&&(i-2)===tci)th.className='th-today';
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);
  // 모든 요일 칸이 같은 내용일 때 colspan=5로 병합할 행 판별
  // merge 대상: 모든 col의 내용·카테고리·sub가 동일하고 비어있지 않을 때
  function shouldMerge(row){
    if(editMode) return false;
    const firstTxt=row[COLS[0]]||'';
    const firstCat=row['cat_'+COLS[0]]||'empty';
    if(!firstTxt && firstCat==='empty') return false; // 모두 빈 행은 병합 안 함
    return COLS.every(c=>(row[c]||'')===(row[COLS[0]]||'') && (row['cat_'+c]||'empty')===(row['cat_'+COLS[0]]||'empty'));
  }

  const data=editMode?ttEdit.rows:tt.rows;
  data.forEach((row,ri)=>{
    const tr=document.createElement('tr');
    // ── 02 홀짝 행 구분 + 교시/쉬는시간 구분 ──
    const isPeriodRow=/교시$/.test(row.label||'');
    tr.className=(ri%2===0?'tt-row-even':'tt-row-odd')+' '+(isPeriodRow?'tt-row-period':'tt-row-rest');
    // 교시 라벨
    const tdL=document.createElement('td');tdL.className='row-lbl';
    if(editMode){
      const inp=document.createElement('input');inp.className='row-lbl-inp';inp.value=row.label;
      inp.addEventListener('input',()=>{ttEdit.rows[ri].label=inp.value;scheduleEditAutosave();});
      const del=document.createElement('button');del.className='del-row-btn';del.textContent='✕';
      del.addEventListener('click',()=>{ttEdit.rows.splice(ri,1);renderTT();scheduleEditAutosave();});
      const w=document.createElement('div');w.style='display:flex;align-items:center;gap:2px;';
      w.appendChild(inp);w.appendChild(del);tdL.appendChild(w);
    }else{tdL.textContent=row.label;}
    tr.appendChild(tdL);
    // 시간
    const tdT=document.createElement('td');tdT.className='row-time';
    if(editMode){
      const inp=document.createElement('input');inp.className='time-inp';inp.value=row.time;
      inp.addEventListener('input',()=>{ttEdit.rows[ri].time=inp.value;scheduleEditAutosave();});
      tdT.appendChild(inp);
    }else{tdT.textContent=row.time;}
    tr.appendChild(tdT);

    // ── 병합 여부 판단 ──
    if(shouldMerge(row)){
      // colspan=5 단일 셀 — 오늘 요일 강조 없음 (전체 병합이므로)
      const td=document.createElement('td');
      td.colSpan=5;
      const cat=row['cat_'+COLS[0]]||'empty';
      td.className=CAT_CLS[cat]||'';
      td.style.textAlign='center';
      const span=document.createElement('span');span.className='cell-txt';span.textContent=row[COLS[0]]||'';td.appendChild(span);
      tr.appendChild(td);
    } else {
      // 요일별 개별 셀
      COLS.forEach((col,ci)=>{
        const td=document.createElement('td');
        const ck='cat_'+col, sk='sub_'+col, ck2='cat2_'+col;
        const cat=row[ck]||'empty';
        const sub2=row[sk]||'';
        const cat2=row[ck2]||'empty';

        if(editMode){
          td.style.padding='3px';
          const wrap=document.createElement('div');wrap.className='cell-edit-wrap';

          // ── 1번 수업 ──
          const cinp=document.createElement('input');cinp.className='cell-inp';cinp.value=row[col]||'';cinp.placeholder='1번 수업';
          cinp.addEventListener('input',()=>{ttEdit.rows[ri][col]=cinp.value;scheduleEditAutosave();});
          const csel=document.createElement('select');csel.className='cat-sel';
          [{v:'pub',l:'노랑(정)'},{v:'park',l:'파랑(박)'},{v:'special',l:'주황(특별)'},{v:'off',l:'회색(공강)'},{v:'empty',l:'색없음'}].forEach(({v,l})=>{
            const o=document.createElement('option');o.value=v;o.textContent=l;if(v===cat)o.selected=true;csel.appendChild(o);
          });
          csel.addEventListener('change',()=>{ttEdit.rows[ri][ck]=csel.value;scheduleEditAutosave();});

          // ── 구분선 ──
          const divider=document.createElement('div');divider.className='cell-edit-divider';divider.textContent='+ 2번 수업';

          // ── 2번 수업 ──
          const cinp2=document.createElement('input');cinp2.className='cell-inp2';cinp2.value=sub2;cinp2.placeholder='2번 수업 (없으면 비워두기)';
          cinp2.addEventListener('input',()=>{ttEdit.rows[ri][sk]=cinp2.value;scheduleEditAutosave();});
          const csel2=document.createElement('select');csel2.className='cat-sel';
          [{v:'pub',l:'노랑(정)'},{v:'park',l:'파랑(박)'},{v:'special',l:'주황(특별)'},{v:'off',l:'회색(공강)'},{v:'empty',l:'색없음'}].forEach(({v,l})=>{
            const o=document.createElement('option');o.value=v;o.textContent=l;if(v===cat2)o.selected=true;csel2.appendChild(o);
          });
          csel2.addEventListener('change',()=>{ttEdit.rows[ri][ck2]=csel2.value;scheduleEditAutosave();});

          wrap.appendChild(cinp);wrap.appendChild(csel);wrap.appendChild(divider);wrap.appendChild(cinp2);wrap.appendChild(csel2);
          td.appendChild(wrap);

        }else{
          // ── 일반 보기: 1번 수업 배경색 기준 ──
          td.className=CAT_CLS[cat]||'';

          const hasTxt=(row[col]||'').trim()!==''||(row[sk]||'').trim()!=='';

          if(row[col]||sub2){
            // 수업이 하나만 있을 때
            if(row[col]&&!sub2){
              td.className=CAT_CLS[cat]||'';
              const span=document.createElement('span');span.className='cell-txt';span.textContent=row[col];td.appendChild(span);
            }
            // 수업이 두 개일 때 — 셀을 위아래로 분할
            else if(row[col]&&sub2){
              td.style.padding='0';td.style.verticalAlign='top';
              td.className=''; // 배경은 내부 div가 담당
              const bgMap={pub:'#fde68a',park:'#93c5fd',special:'#fdba74',off:'#eef2f0',empty:'#ffffff'};
              // 위: 1번 수업
              const top=document.createElement('div');
              top.style.cssText=`background:${bgMap[cat]||'#fff'};padding:5px 6px;border-bottom:1.5px solid rgba(0,0,0,.08);min-height:50%;display:flex;align-items:center;justify-content:center;`;
              const s1=document.createElement('span');s1.className='cell-txt';s1.textContent=row[col];top.appendChild(s1);
              // 아래: 2번 수업
              const bot=document.createElement('div');
              bot.style.cssText=`background:${bgMap[cat2]||'#fff'};padding:5px 6px;min-height:50%;display:flex;align-items:center;justify-content:center;`;
              const s2=document.createElement('span');s2.className='cell-txt';s2.textContent=sub2;bot.appendChild(s2);
              td.appendChild(top);td.appendChild(bot);
            }
            // 2번만 있는 경우(1번 비어있음)
            else if(!row[col]&&sub2){
              td.className=CAT_CLS[cat2]||'';
              const span=document.createElement('span');span.className='cell-txt';span.textContent=sub2;td.appendChild(span);
            }
          }

          // 수업 있는 셀 클릭 강조 (항상 마지막에 적용 — 위 분기에서 className이 초기화돼도 유지되도록)
          if(hasTxt){
            td.classList.add('has-content');
            td.addEventListener('click',e=>{
              e.stopPropagation();
              if(selectedCell&&selectedCell.ri===ri&&selectedCell.ci===ci){clearSelection();}
              else{applySelection(ri,ci);}
            });
          }

          // 오늘 요일 강조 — 해당 열 전체를 굵은 테두리로 감싸기 (개별 셀이 아니라 열 바깥쪽 테두리)
          if(ci===tci){
            td.classList.add('day-col-today');
            if(ri===data.length-1) td.classList.add('day-col-today-last');
          }
        }
        tr.appendChild(td);
      });
    }
    tbody.appendChild(tr);
  });
  if(editMode){
    $('ttScroll').classList.add('editing-mode');
    clearSelection();
  } else {
    $('ttScroll').classList.remove('editing-mode');
    // 선택 상태 복원
    if(selectedCell)applySelection(selectedCell.ri,selectedCell.ci);
  }
}

  document.body.removeChild(a);

});

// ── 레거시 데이터 마이그레이션: "A/B" → 1번:A, 2번:B ──
function migrateLegacySlash(){
  let changed=false;
  tt.rows.forEach(r=>{
    COLS.forEach(c=>{
      const val=r[c]||'';
      const sub=r['sub_'+c]||'';
      // 이미 sub가 있으면 건너뜀
      if(sub) return;
      // "/" 포함 + 앞뒤 둘 다 내용 있을 때만
      if(val.includes('/')&&val.indexOf('/')>0&&val.indexOf('/')< val.length-1){
        const parts=val.split('/');
        r[c]=parts[0].trim();
        r['sub_'+c]=parts[1].trim();
        if(!r['cat2_'+c]||r['cat2_'+c]==='empty') r['cat2_'+c]='empty';
        changed=true;
      }
    });
  });
  if(changed){sv(ttKey(),tt);}
}

// 초기화
document.getElementById('semTab1').addEventListener('click',()=>switchSemester('1학기'));
document.getElementById('semTab2').addEventListener('click',()=>switchSemester('2학기'));

document.getElementById('reloadBtn').addEventListener('click', async ()=>{
  if(editMode){showToast('⚠️ 편집 중에는 다시 불러올 수 없어요. 저장하거나 취소한 뒤 시도해주세요');return;}
  if(!CLOUD_ENABLED){showToast('⚠️ 구글시트 연결이 설정되어 있지 않아요');return;}
  const ok=await cloudLoadAll();
  loadActiveSemesterData();
  applyUI();
  renderHR();
  renderHRSummary();
  renderLegend();
  renderTT();
  setSyncStatus(ok?'done':'error');
  if(ok) showToast('🔄 구글시트에서 최신 내용을 불러왔어요');
});

async function initApp(){
  ACTIVE_SEMESTER=localStorage.getItem('active_semester')||'1학기';
  await cloudLoadAll();
  loadActiveSemesterData();
  applyUI();
  renderHR();
  renderHRSummary();
  renderLegend();
  migrateLegacySlash();
  renderTT();
  setHR(false);
  renderSemesterTabs();
  // 구글시트가 비어있었던 항목은 최초 1회 기본 데이터를 업로드해서 실제로 저장되게 함
  if(needsSeedSchedule[ACTIVE_SEMESTER]){needsSeedSchedule[ACTIVE_SEMESTER]=false;cloudSaveSchedule(ACTIVE_SEMESTER);}
  if(needsSeedSettings){needsSeedSettings=false;cloudSaveSettings();}
  if(!CLOUD_ENABLED) setSyncStatus('');
}
initApp();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── 01 시간표 초기화 ──
$('resetBtn').addEventListener('click',()=>{
  if(!confirm('시간표의 월~금 수업 내용을 모두 초기화할까요?\n교시명과 시간은 유지됩니다.')) return;
  // ttEdit이 없으면 tt에서 복사
  if(!ttEdit) ttEdit=JSON.parse(JSON.stringify(tt));
  ttEdit.rows.forEach(r=>{
    COLS.forEach(c=>{
      r[c]='';
      r['sub_'+c]='';
      r['cat_'+c]='empty';
      if(r['cat2_'+c]!==undefined) r['cat2_'+c]='empty';
    });
  });
  // tt도 바로 반영 + 저장
  tt=JSON.parse(JSON.stringify(ttEdit));
  sv(ttKey(),tt);
  renderTT();
  showToast('🗑️ 수업 내용이 초기화되었습니다');
});
